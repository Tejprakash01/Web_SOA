apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lab8
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "api-gateway"
        metrics_path: /metrics
        static_configs:
          - targets: ["api-gateway:3000"]
            labels:
              service: "api-gateway"

      - job_name: "user-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["user-service:3001"]
            labels:
              service: "user-service"

      - job_name: "product-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["product-service:3002"]
            labels:
              service: "product-service"

      - job_name: "order-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["order-service:3003"]
            labels:
              service: "order-service"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lab8
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lab8
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30090
