apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: lab8
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: campusconnect
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
      protocol: TCP
